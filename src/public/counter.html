<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SortieTicket counter</title>
<link rel="stylesheet" href="/fonts/oswald/700.css">
<link rel="stylesheet" href="/fonts/noto/900.css">
<style>
  /* 分隊ランク表示（overlay.html）と同じ部品感：斜めのプレート・白フチ・Oswald・黄色のアクセント */
  :root {
    --win: #1fa055;
    --lose: #e5484d;
    --draw: #7b8592;
    --gauge: #ffd23c;
    --dark: #1b2330;
    --skew: -20deg;
    --border: 3px solid rgba(255,255,255,.95);
    --shadow: 0 3px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.45);
    --scale: 1;
    --font-num: "Oswald", "Bahnschrift", "Arial Narrow", Impact, sans-serif;
  }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body.preview {
    background-color: #2b2f36;
    background-image: linear-gradient(45deg, #353a42 25%, transparent 25%), linear-gradient(-45deg, #353a42 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #353a42 75%), linear-gradient(-45deg, transparent 75%, #353a42 75%);
    background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  }
  #stage { padding: 20px 44px; transform: scale(var(--scale)); transform-origin: 0 0; display: inline-block; }
  .counter { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 10px; font-family: var(--font-num); font-weight: 700; color: #fff; }
  .counter > [hidden] { display: none !important; }

  .plate { box-sizing: border-box; transform: skewX(var(--skew)); border: var(--border); box-shadow: var(--shadow); position: relative; }
  .unskew { transform: skewX(calc(var(--skew) * -1)); display: inline-block; }
  .txt { line-height: 1; white-space: nowrap; text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 6px rgba(0,0,0,.25); font-variant-numeric: tabular-nums; }
  .yellow { color: var(--gauge); -webkit-text-stroke: 1.5px rgba(0,0,0,.55); paint-order: stroke fill; text-shadow: 0 2px 4px rgba(0,0,0,.5); }

  /* 直近の戦績（ゲージと同じ傾きの小さな札） */
  .recent { display: flex; gap: 6px; padding-left: 4px; }
  .recent i {
    width: 30px; height: 30px; box-sizing: border-box; transform: skewX(var(--skew));
    display: flex; align-items: center; justify-content: center; font-style: normal;
    border: 2px solid rgba(255,255,255,.9); box-shadow: 0 2px 4px rgba(0,0,0,.45);
    background: rgba(20,24,30,.55);
  }
  .recent i > b { transform: skewX(calc(var(--skew) * -1)); font-size: 19px; line-height: 1; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
  .recent i.W { background: var(--win); }
  .recent i.L { background: var(--lose); }
  .recent i.D { background: var(--draw); }
  .recent i.empty { border-color: rgba(255,255,255,.35); border-style: dashed; }
  .recent i.new { animation: drop .35s ease-out; }
  @keyframes drop { 0% { transform: skewX(var(--skew)) translateY(-14px) scale(1.3); opacity: 0; } 100% { transform: skewX(var(--skew)); opacity: 1; } }

  .pop { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }

  /* ---- 案A: プレート2枚 ---- */
  .d-plate .rate { display: flex; align-items: baseline; gap: 12px; padding-left: 26px; }
  .d-plate .rate .lab { font-size: 26px; letter-spacing: 1px; }
  .d-plate .rate .val { font-size: 44px; }
  .d-plate .pair { display: flex; gap: 12px; }
  .d-plate .pair .plate { width: 210px; height: 96px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 18px; }
  .d-plate .win { background: var(--win); }
  .d-plate .lose { background: var(--lose); }
  .d-plate .pair .lab { font-size: 26px; letter-spacing: 1px; opacity: .95; }
  .d-plate .pair .num { font-size: 72px; }

  /* ---- 案B: ワイド1枚＋勝率札 ---- */
  .d-wide .main { display: flex; align-items: stretch; }
  .d-wide .score { width: 400px; height: 104px; background: var(--dark); display: flex; align-items: center; justify-content: center; gap: 18px; }
  .d-wide .side { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; }
  .d-wide .side .lab { font-size: 20px; letter-spacing: 2px; }
  .d-wide .side .num { font-size: 66px; }
  .d-wide .win .lab { color: #5fe08f; }
  .d-wide .lose .lab { color: #ff8a8d; }
  .d-wide .dash { font-size: 54px; opacity: .8; }
  .d-wide .rate { margin-left: 10px; width: 150px; height: 104px; background: var(--gauge); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .d-wide .rate .txt { color: #111; text-shadow: none; }
  .d-wide .rate .lab { font-size: 18px; letter-spacing: 1px; }
  .d-wide .rate .val { font-size: 46px; }
  .d-wide .rate.nolabel .val { font-size: 54px; }

  /* ---- 案C: 見方枠風（上下2段） ---- */
  .d-split .plate { width: 380px; display: flex; flex-direction: column; overflow: hidden; }
  .d-split .top { display: flex; height: 96px; }
  .d-split .top > div { flex: 1 1 0; display: flex; align-items: center; justify-content: center; }
  .d-split .win { background: var(--win); }
  .d-split .lose { background: var(--lose); border-left: var(--border); }
  .d-split .top .txt { display: flex; align-items: baseline; gap: 12px; }
  .d-split .top .lab { font-size: 24px; letter-spacing: 1px; }
  .d-split .top .num { font-size: 70px; }
  .d-split .bottom { height: 42px; background: var(--gauge); border-top: var(--border); display: flex; align-items: center; justify-content: center; }
  .d-split .bottom .txt { color: #111; text-shadow: none; display: flex; align-items: baseline; gap: 12px; }
  .d-split .bottom .lab { font-size: 22px; letter-spacing: 1px; }
  .d-split .bottom .val { font-size: 32px; }
  .d-split.norate .bottom { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var preview = q.has("preview");
  if (preview) document.body.classList.add("preview");
  if (q.get("scale")) document.documentElement.style.setProperty("--scale", q.get("scale"));
  var forceDesign = q.get("design");
  var root = document.getElementById("root");
  var shown = null;      // 今描いている見た目（変わったら組み直す）
  var lastLen = null;    // 直近の戦績のアニメーション判定用

  var TPL = {
    plate:
      '<div class="counter d-plate">' +
        '<div class="rate" data-rate><span class="txt yellow lab" data-ratelab>WIN RATE</span><span class="txt yellow val" data-val="rate"></span></div>' +
        '<div class="pair">' +
          '<div class="plate win"><span class="unskew txt lab">WIN</span><span class="unskew txt num" data-val="wins"></span></div>' +
          '<div class="plate lose"><span class="unskew txt lab">LOSE</span><span class="unskew txt num" data-val="losses"></span></div>' +
        '</div>' +
        '<div class="recent" data-recent></div>' +
      '</div>',
    wide:
      '<div class="counter d-wide">' +
        '<div class="main">' +
          '<div class="plate score"><div class="unskew" style="display:flex;align-items:center;gap:18px">' +
            '<div class="side win"><span class="txt lab">WIN</span><span class="txt num" data-val="wins"></span></div>' +
            '<span class="txt dash">-</span>' +
            '<div class="side lose"><span class="txt lab">LOSE</span><span class="txt num" data-val="losses"></span></div>' +
          '</div></div>' +
          '<div class="plate rate" data-rate><span class="unskew txt lab" data-ratelab>WIN RATE</span><span class="unskew txt val" data-val="rate"></span></div>' +
        '</div>' +
        '<div class="recent" data-recent></div>' +
      '</div>',
    split:
      '<div class="counter d-split">' +
        '<div class="plate">' +
          '<div class="top">' +
            '<div class="win"><span class="unskew txt"><span class="lab">WIN</span><span class="num" data-val="wins"></span></span></div>' +
            '<div class="lose"><span class="unskew txt"><span class="lab">LOSE</span><span class="num" data-val="losses"></span></span></div>' +
          '</div>' +
          '<div class="bottom" data-rate><span class="unskew txt"><span class="lab" data-ratelab>WIN RATE</span><span class="val" data-val="rate"></span></span></div>' +
        '</div>' +
        '<div class="recent" data-recent></div>' +
      '</div>',
  };

  function summarize(results) {
    var w = 0, l = 0, d = 0;
    results.forEach(function (r) { if (r === "W") w++; else if (r === "L") l++; else d++; });
    return { wins: w, losses: l, draws: d, rate: w + l > 0 ? w / (w + l) : null };
  }

  function setText(el, v) {
    if (!el || el.textContent === v) return;
    var had = el.textContent !== "";
    el.textContent = v;
    if (had) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  }

  function render(c) {
    if (!c || !c.settings || !Array.isArray(c.results)) return;
    var st = c.settings;
    var design = TPL[forceDesign] ? forceDesign : (TPL[st.design] ? st.design : "plate");
    if (shown !== design) { root.innerHTML = TPL[design]; shown = design; lastLen = null; }
    var box = root.firstChild;
    var s = summarize(c.results);
    setText(box.querySelector('[data-val="wins"]'), String(s.wins));
    setText(box.querySelector('[data-val="losses"]'), String(s.losses));
    setText(box.querySelector('[data-val="rate"]'), s.rate === null ? "--%" : Math.round(s.rate * 100) + "%");

    var rate = box.querySelector("[data-rate]");
    rate.hidden = !st.showRate;
    box.classList.toggle("norate", !st.showRate);
    box.querySelector("[data-ratelab]").hidden = !st.showRateLabel;
    rate.classList.toggle("nolabel", !st.showRateLabel);

    var rc = box.querySelector("[data-recent]");
    rc.hidden = !st.showRecent;
    var n = st.recentCount || 10;
    var recent = c.results.slice(-n);
    var grew = lastLen !== null && c.results.length > lastLen;
    lastLen = c.results.length;
    while (rc.children.length < n) rc.appendChild(document.createElement("i")).appendChild(document.createElement("b"));
    while (rc.children.length > n) rc.removeChild(rc.lastChild);
    for (var i = 0; i < n; i++) {
      var r = recent[i], el = rc.children[i];
      el.className = r ? r : "empty";
      el.firstChild.textContent = r || "";
      if (grew && i === recent.length - 1) el.classList.add("new");
    }
  }

  // 操作画面のプレビュー（iframe）は postMessage で即時反映
  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (ev.origin === location.origin && d && d.type === "counter-state") render(d.counter);
  });

  // 本番: アプリからの配信（Server-Sent Events。切れても自動で再接続）
  var es = new EventSource("/events");
  es.addEventListener("counter", function (ev) {
    try { render(JSON.parse(ev.data).counter); } catch (e) {}
  });
})();
</script>
</body>
</html>
